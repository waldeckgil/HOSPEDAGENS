<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <title>Configurar Pousada</title>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Navegação Superior -->
    <header class="bg-white shadow mb-6">
        <div class="max-w-3xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-gray-800">Painel do Gestor</h1>
            <a href="dashboard.html" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-xl font-semibold hover:bg-gray-300 transition flex items-center gap-2">
                ← Voltar para o Dashboard
            </a>
        </div>
    </header>

    <div class="max-w-2xl mx-auto bg-white p-8 rounded-2xl shadow-xl mb-12">
        <h2 class="text-2xl font-bold mb-6">Configurar sua Pousada</h2>
        
        <!-- Container de Alertas / Mensagens no Front-end -->
        <div id="mensagem-container" class="hidden mb-6 p-4 rounded-xl text-sm font-medium"></div>

        <!-- Modal de Confirmação Inline (para renomeação ou exclusão) -->
        <div id="modal-confirmacao" class="hidden mb-6 p-4 bg-amber-50 border border-amber-300 rounded-xl">
            <p id="texto-confirmacao" class="text-amber-800 font-semibold mb-3"></p>
            <div class="flex gap-3">
                <button id="btn-confirma-sim" class="bg-amber-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-amber-700 transition">Confirmar</button>
                <button id="btn-confirma-nao" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg font-bold hover:bg-gray-300 transition">Cancelar</button>
            </div>
        </div>

        <div class="mb-6">
            <label class="block font-semibold mb-2">Nome da Pousada</label>
            <input type="text" id="nome-pousada" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Ex: Pousada do Sol">
        </div>

        <div id="suites-container" class="space-y-3 mb-6">
            <label class="block font-semibold">Suítes</label>
            <!-- As suítes existentes e novos campos serão injetados aqui -->
        </div>

        <button onclick="adicionarCampo()" class="text-blue-600 font-bold mb-6 block hover:underline">+ Adicionar outra suíte</button>
        
        <button onclick="salvarConfiguracao()" class="w-full bg-blue-600 text-white p-3 rounded-xl font-bold hover:bg-blue-700 transition">Salvar Alterações</button>
    </div>

    <script>
        const supabaseClient = supabase.createClient('https://evrkniykafvydnhxycit.supabase.co', 'sb_publishable_TCHdTjTVsu652onrjqjptw_RUCJaqTs');
        let nomePousadaOriginal = '';

        // Exibe mensagens bonitas direto no front-end
        function mostrarMensagem(texto, tipo = 'erro') {
            const container = document.getElementById('mensagem-container');
            container.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700', 'bg-blue-100', 'text-blue-700');
            
            if (tipo === 'erro') {
                container.classList.add('bg-red-100', 'text-red-700');
            } else if (tipo === 'sucesso') {
                container.classList.add('bg-green-100', 'text-green-700');
            } else {
                container.classList.add('bg-blue-100', 'text-blue-700');
            }
            container.innerText = texto;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function esconderMensagem() {
            document.getElementById('mensagem-container').classList.add('hidden');
        }

        // Carrega os dados da pousada e suas suítes ao abrir a página
        async function carregarConfiguracao() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) {
                mostrarMensagem('Sessão expirada. Redirecionando...', 'erro');
                setTimeout(() => window.location.href = 'index.html', 2000);
                return;
            }

            // 1. Busca os dados da pousada do usuário
            const { data: pousada, error: errPousada } = await supabaseClient
                .from('pousadas')
                .select('nome')
                .eq('id', user.id)
                .maybeSingle();

            if (pousada && pousada.nome) {
                nomePousadaOriginal = pousada.nome;
                document.getElementById('nome-pousada').value = pousada.nome;
            }

            // 2. Busca as suítes já cadastradas para esta pousada
            const { data: suites, error: errSuites } = await supabaseClient
                .from('suites')
                .select('id, nome')
                .eq('pousada_id', user.id);

            const container = document.getElementById('suites-container');
            container.innerHTML = '<label class="block font-semibold">Suítes</label>';

            if (suites && suites.length > 0) {
                suites.forEach(suite => {
                    adicionarCampo(suite.id, suite.nome);
                });
            } else {
                adicionarCampo();
            }
        }

        // Adiciona um campo de suíte
        function adicionarCampo(id = '', nome = '') {
            const container = document.getElementById('suites-container');
            const div = document.createElement('div');
            div.className = 'flex gap-2 items-center';
            div.dataset.suiteId = id;
            
            div.innerHTML = `
                <input type="text" class="suite-input w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Nome da Suíte (ex: Suíte 01)" value="${nome}">
                <button type="button" onclick="removerCampo(this)" class="bg-red-100 text-red-600 px-4 py-3 rounded-xl font-bold hover:bg-red-200 transition">Excluir</button>
            `;
            container.appendChild(div);
        }

        // Remove o campo da tela e deleta do banco com confirmação visual
        async function removerCampo(botao) {
            const div = botao.parentElement;
            const suiteId = div.dataset.suiteId;

            if (suiteId) {
                const modal = document.getElementById('modal-confirmacao');
                const texto = document.getElementById('texto-confirmacao');
                const btnSim = document.getElementById('btn-confirma-sim');
                const btnNao = document.getElementById('btn-confirma-nao');

                texto.innerText = "Deseja realmente excluir esta suíte do sistema?";
                modal.classList.remove('hidden');

                btnSim.onclick = async () => {
                    modal.classList.add('hidden');
                    const { error } = await supabaseClient.from('suites').delete().eq('id', suiteId);
                    if (error) {
                        mostrarMensagem('Erro ao excluir suíte do banco de dados.', 'erro');
                        return;
                    }
                    div.remove();
                    mostrarMensagem('Suíte excluída com sucesso.', 'sucesso');
                };

                btnNao.onclick = () => {
                    modal.classList.add('hidden');
                };
            } else {
                div.remove();
            }
        }

        // Executa a persistência após validações
        async function executarSalvamento() {
            const nomePousada = document.getElementById('nome-pousada').value;
            const linhasSuites = document.querySelectorAll('#suites-container > div');
            
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) return;

            const { error: errPousada } = await supabaseClient.from('pousadas').upsert({ 
                id: user.id, 
                nome: nomePousada.trim() 
            }, { onConflict: 'id' });

            if (errPousada) {
                mostrarMensagem('Erro ao salvar os dados da pousada: ' + errPousada.message, 'erro');
                return;
            }
            
            const novasSuites = [];
            linhasSuites.forEach(div => {
                const input = div.querySelector('.suite-input');
                const suiteId = div.dataset.suiteId;
                const valorNome = input.value.trim();

                if (valorNome !== "" && !suiteId) {
                    novasSuites.push({ 
                        nome: valorNome, 
                        status: 'Disponível',
                        pousada_id: user.id 
                    });
                }
            });

            if (novasSuites.length > 0) {
                const { error: errSuites } = await supabaseClient.from('suites').insert(novasSuites);
                if (errSuites) {
                    mostrarMensagem('Erro ao salvar novas suítes.', 'erro');
                    return;
                }
            }

            mostrarMensagem('Configurações salvas com sucesso! Redirecionando...', 'sucesso');
            setTimeout(() => window.location.href = 'dashboard.html', 1500);
        }

        // Valida se a pousada foi renomeada e avisa no front-end antes de salvar
        async function salvarConfiguracao() {
            esconderMensagem();
            const nomePousada = document.getElementById('nome-pousada').value.trim();
            
            if (!nomePousada) {
                mostrarMensagem('O nome da pousada não pode ficar vazio.', 'erro');
                return;
            }

            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) {
                mostrarMensagem('Sessão expirada. Faça login novamente.', 'erro');
                return;
            }

            // Se já existia uma pousada cadastrada e o nome foi alterado, avisa o gestor na interface
            if (nomePousadaOriginal && nomePousadaOriginal !== nomePousada) {
                const modal = document.getElementById('modal-confirmacao');
                const texto = document.getElementById('texto-confirmacao');
                const btnSim = document.getElementById('btn-confirma-sim');
                const btnNao = document.getElementById('btn-confirma-nao');

                texto.innerText = `Atenção: Você está renomeando sua pousada de "${nomePousadaOriginal}" para "${nomePousada}". Deseja continuar?`;
                modal.classList.remove('hidden');

                btnSim.onclick = () => {
                    modal.classList.add('hidden');
                    executarSalvamento();
                };

                btnNao.onclick = () => {
                    modal.classList.add('hidden');
                };
            } else {
                executarSalvamento();
            }
        }
    </script>
</body>
</html>
