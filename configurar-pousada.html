<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <title>Configurar Pousada</title>
</head>
<body class="bg-gray-100 p-8" onload="carregarConfiguracao()">
    <div class="max-w-2xl mx-auto bg-white p-8 rounded-2xl shadow-xl">
        <h2 class="text-2xl font-bold mb-6">Configurar sua Pousada</h2>
        
        <div class="mb-6">
            <label class="block font-semibold mb-2">Nome da Pousada</label>
            <input type="text" id="nome-pousada" class="w-full p-3 border rounded-xl" placeholder="Ex: Pousada do Sol">
        </div>

        <div id="suites-container" class="space-y-3 mb-6">
            <label class="block font-semibold">Suítes</label>
            <!-- As suítes existentes e novos campos serão injetados aqui -->
        </div>

        <button onclick="adicionarCampo()" class="text-blue-600 font-bold mb-6 block">+ Adicionar outra suíte</button>
        
        <button onclick="salvarConfiguracao()" class="w-full bg-blue-600 text-white p-3 rounded-xl font-bold hover:bg-blue-700 transition">Salvar Alterações</button>
    </div>

    <script>
        const supabaseClient = supabase.createClient('https://evrkniykafvydnhxycit.supabase.co', 'sb_publishable_TCHdTjTVsu652onrjqjptw_RUCJaqTs');

        // Carrega os dados da pousada e suas suítes ao abrir a página
        async function carregarConfiguracao() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) {
                alert('Sessão expirada. Faça login novamente.');
                window.location.href = 'index.html';
                return;
            }

            // 1. Busca os dados da pousada do usuário
            const { data: pousada, error: errPousada } = await supabaseClient
                .from('pousadas')
                .select('nome')
                .eq('id', user.id)
                .maybeSingle();

            if (pousada) {
                document.getElementById('nome-pousada').value = pousada.nome || '';
            }

            // 2. Busca as suítes já cadastradas para esta pousada
            const { data: suites, error: errSuites } = await supabaseClient
                .from('suites')
                .select('id, nome')
                .eq('pousada_id', user.id);

            const container = document.getElementById('suites-container');
            container.innerHTML = '<label class="block font-semibold">Suítes</label>';

            if (suites && suites.length > 0) {
                suites.forEach(suite => {
                    adicionarCampo(suite.id, suite.nome);
                });
            } else {
                // Se não tiver nenhuma, abre um campo em branco
                adicionarCampo();
            }
        }

        // Adiciona um campo de suíte (com suporte a ID para itens já existentes)
        function adicionarCampo(id = '', nome = '') {
            const container = document.getElementById('suites-container');
            const div = document.createElement('div');
            div.className = 'flex gap-2 items-center';
            div.dataset.suiteId = id; // Armazena o ID do banco se existir
            
            div.innerHTML = `
                <input type="text" class="suite-input w-full p-3 border rounded-xl" placeholder="Nome da Suíte (ex: Suíte 01)" value="${nome}">
                <button type="button" onclick="removerCampo(this)" class="bg-red-100 text-red-600 px-4 py-3 rounded-xl font-bold hover:bg-red-200 transition">Excluir</button>
            `;
            container.appendChild(div);
        }

        // Remove o campo da tela e deleta do banco se já possuir ID cadastrado
        async function removerCampo(botao) {
            const div = botao.parentElement;
            const suiteId = div.dataset.suiteId;

            if (suiteId) {
                if (confirm('Deseja realmente excluir esta suíte do sistema?')) {
                    const { error } = await supabaseClient
                        .from('suites')
                        .delete()
                        .eq('id', suiteId);
                    
                    if (error) {
                        console.error("Erro ao deletar suíte:", error);
                        alert('Erro ao excluir suíte do banco de dados.');
                        return;
                    }
                    div.remove();
                }
            } else {
                div.remove();
            }
        }

        // Salva ou atualiza as configurações da pousada e novas suítes
        async function salvarConfiguracao() {
            const nomePousada = document.getElementById('nome-pousada').value;
            const linhasSuites = document.querySelectorAll('#suites-container > div');
            
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) {
                alert('Sessão expirada. Faça login novamente.');
                return;
            }

            if (!nomePousada.trim()) {
                alert('O nome da pousada não pode ficar vazio.');
                return;
            }

            // 1. Atualiza ou insere o nome da pousada enviando um objeto simples (Corrige o erro 403 e colunas)
            const { error: errPousada } = await supabaseClient.from('pousadas').upsert({ 
                id: user.id, 
                nome: nomePousada.trim() 
            });

            if (errPousada) {
                console.error("Erro na pousada:", errPousada);
                alert('Erro ao salvar os dados da pousada.');
                return;
            }
            
            // 2. Separa o que é nova suíte (sem ID) para inserir
            const novasSuites = [];
            linhasSuites.forEach(div => {
                const input = div.querySelector('.suite-input');
                const suiteId = div.dataset.suiteId;
                const valorNome = input.value.trim();

                if (valorNome !== "" && !suiteId) {
                    novasSuites.push({ 
                        nome: valorNome, 
                        status: 'Disponível',
                        pousada_id: user.id 
                    });
                }
            });

            if (novasSuites.length > 0) {
                const { error: errSuites } = await supabaseClient.from('suites').insert(novasSuites);
                if (errSuites) {
                    console.error(errSuites);
                    alert('Erro ao salvar novas suítes.');
                    return;
                }
            }

            alert('Configurações salvas com sucesso!');
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
