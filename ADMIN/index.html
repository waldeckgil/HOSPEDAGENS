<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Login - Gestor de Pousadas</title>
    <style>
        .bg-fundo-pousada {
            background-image: linear-gradient(rgba(30, 58, 138, 0.85), rgba(15, 23, 42, 0.9)), url('https://investidorsardinha.r7.com/wp-content/uploads/2020/12/tipos-de-empresa-as-7-modalidades-existentes-caracteristicas-e-portes-3-1024x644.jpg');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="bg-fundo-pousada flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 sm:p-10 rounded-3xl shadow-2xl w-full max-w-md border border-gray-100 relative">
        <div class="text-center mb-6">
            <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center mx-auto text-xl font-bold mb-3 border border-blue-100 shadow-xs">
                <i class="fa-solid fa-hotel"></i>
            </div>
            <h2 class="text-2xl font-extrabold text-gray-900">Bem-vindo</h2>
            <p class="text-gray-500 text-xs mt-1">Acesse o painel da sua pousada</p>
        </div>

        <!-- MENSAGEM DE STATUS DO PLANO - APARECE APÓS O LOGIN -->
        <div id="card-aviso-login" class="hidden mb-6 p-4 rounded-2xl border-l-4 shadow-sm transition-all duration-300">
            <div class="flex items-start gap-3">
                <div id="aviso-login-icone" class="text-xl mt-0.5">🔔</div>
                <div class="flex-1">
                    <p id="aviso-login-titulo" class="text-xs font-extrabold leading-tight"></p>
                    <p id="aviso-login-texto" class="text-[11px] mt-1 leading-relaxed text-slate-700"></p>
                    <p id="aviso-login-sub" class="text-[10px] mt-1.5 font-bold opacity-80"></p>
                </div>
            </div>
            <div class="mt-3">
                <div class="w-full bg-gray-200 rounded-full h-1.5 overflow-hidden">
                    <div id="aviso-login-progress" class="h-1.5 bg-blue-600 transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>
            <p class="text-[10px] text-gray-500 mt-2 text-center">Redirecionando em <span id="aviso-login-countdown" class="font-bold">3</span>s...</p>
        </div>

        <!-- FORMULÁRIO DE LOGIN -->
        <div id="login-form-container">
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">E-mail</label>
                    <input id="email" type="email" class="w-full p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none text-xs font-medium bg-gray-50 transition" placeholder="seu@email.com" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Senha</label>
                    <input id="password" type="password" class="w-full p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none text-xs font-medium bg-gray-50 transition" placeholder="••••••••" required>
                </div>
                <button type="submit" id="btn-entrar" class="w-full bg-blue-600 hover:bg-blue-700 text-white p-3 rounded-xl font-bold text-sm transition duration-300 shadow-lg shadow-blue-200 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-right-to-bracket"></i> Entrar
                </button>
            </form>

            <div class="mt-6 pt-5 border-t border-gray-100 text-center">
                <p class="text-xs text-gray-600">Não possui conta? 
                    <a href="cadastro.html" class="text-blue-600 font-bold hover:text-blue-800 transition">Cadastre sua Pousada</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://evrkniykafvydnhxycit.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_TCHdTjTVsu652onrjqjptw_RUCJaqTs';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function mostrarAvisoLogin(tipo, titulo, texto, subtexto){
            const card = document.getElementById('card-aviso-login');
            const tituloEl = document.getElementById('aviso-login-titulo');
            const textoEl = document.getElementById('aviso-login-texto');
            const subEl = document.getElementById('aviso-login-sub');
            const iconeEl = document.getElementById('aviso-login-icone');
            const progressEl = document.getElementById('aviso-login-progress');
            
            tituloEl.innerText = titulo;
            textoEl.innerText = texto;
            subEl.innerText = subtexto || '';

            card.classList.remove('hidden');
            
            if(tipo === 'sucesso'){
                card.className = 'mb-6 p-4 rounded-2xl border-l-4 shadow-sm bg-emerald-50 border-emerald-500 text-emerald-900';
                iconeEl.innerText = '✅';
                progressEl.className = 'h-1.5 bg-emerald-600 transition-all duration-300';
            } else if(tipo === 'alerta'){
                card.className = 'mb-6 p-4 rounded-2xl border-l-4 shadow-sm bg-amber-50 border-amber-500 text-amber-900';
                iconeEl.innerText = '⚠️';
                progressEl.className = 'h-1.5 bg-amber-500 transition-all duration-300';
            } else if(tipo === 'erro' || tipo === 'bloqueado'){
                card.className = 'mb-6 p-4 rounded-2xl border-l-4 shadow-sm bg-red-50 border-red-500 text-red-900';
                iconeEl.innerText = '🚫';
                progressEl.className = 'h-1.5 bg-red-600 transition-all duration-300';
            } else {
                card.className = 'mb-6 p-4 rounded-2xl border-l-4 shadow-sm bg-blue-50 border-blue-500 text-blue-900';
                iconeEl.innerText = '⏳';
                progressEl.className = 'h-1.5 bg-blue-600 transition-all duration-300';
            }
        }

        function iniciarContagemERedirecionar(destino){
            let count = 3;
            const countdownEl = document.getElementById('aviso-login-countdown');
            const progressEl = document.getElementById('aviso-login-progress');
            
            setTimeout(()=>{ if(progressEl) progressEl.style.width = '100%'; }, 50);

            const interval = setInterval(()=>{
                count--;
                if(countdownEl) countdownEl.innerText = count;
                if(count <= 0){
                    clearInterval(interval);
                    window.location.href = destino;
                }
            }, 1000);
        }

        document.getElementById('login-form').addEventListener('submit', async function(e){
            e.preventDefault();
            const btn = document.getElementById('btn-entrar');
            btn.disabled = true;
            btn.innerText = 'Verificando...';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                await supabaseClient.auth.signOut();
                const resultado = await supabaseClient.auth.signInWithPassword({ email, password });

                if(resultado.error){
                    alert("Erro ao fazer login: " + resultado.error.message);
                    btn.disabled = false;
                    btn.innerText = 'Entrar';
                    return;
                }

                const userId = resultado.data.user.id;
                
                let pousada = null;
                try {
                    const { data } = await supabaseClient
                        .from('pousadas')
                        .select('id, nome, status, data_vencimento, plano_valor')
                        .eq('id', userId)
                        .maybeSingle();
                    pousada = data;
                } catch(err){ console.log('Pousada sem colunas de plano', err); }

                if(!pousada){
                    mostrarAvisoLogin('info', 'Primeiro acesso', 'Vamos configurar sua pousada para começar.', 'Redirecionando...');
                    document.getElementById('login-form-container').classList.add('hidden');
                    iniciarContagemERedirecionar('configurar-pousada.html');
                    return;
                }

                let diasAviso = 5;
                try {
                    const { data: config } = await supabaseClient
                        .from('config_sistema')
                        .select('dias_aviso_vencimento')
                        .eq('id', 1)
                        .maybeSingle();
                    if(config && config.dias_aviso_vencimento) diasAviso = Number(config.dias_aviso_vencimento);
                } catch(e){}

                const status = (pousada.status || 'active').toLowerCase();
                const vencStr = pousada.data_vencimento;
                let diasRestantes = null;
                let vencDate = null;
                if(vencStr){
                    vencDate = new Date(vencStr + 'T12:00:00');
                    const hoje = new Date(); hoje.setHours(0,0,0,0);
                    diasRestantes = Math.ceil((vencDate - hoje) / (1000*60*60*24));
                }

                document.getElementById('login-form-container').classList.add('hidden');

                if(status === 'pending'){
                    mostrarAvisoLogin('alerta', 'Aguardando aprovação', 'Seu cadastro está em análise. Acesso em modo somente leitura.', `Pousada: ${pousada.nome}`);
                    iniciarContagemERedirecionar('dashboard.html');
                } else if(status === 'blocked' || (diasRestantes !== null && diasRestantes < 0)){
                    const vencTxt = vencDate ? vencDate.toLocaleDateString('pt-BR') : 'vencido';
                    mostrarAvisoLogin('bloqueado', 'Plano Vencido', `Acesso em modo somente leitura desde ${vencTxt}.`, 'Regularize sua assinatura com o administrador para voltar a aprovar reservas.');
                    iniciarContagemERedirecionar('dashboard.html');
                } else if(diasRestantes !== null && diasRestantes <= diasAviso){
                    const diasTxt = diasRestantes === 0 ? 'vence hoje' : `vence em ${diasRestantes} dia(s)`;
                    mostrarAvisoLogin('alerta', `Lembrete: Seu plano ${diasTxt}!`, `Data de pagamento: ${vencDate.toLocaleDateString('pt-BR')}.`, 'Regularize com o administrador para evitar a suspensão de reservas.');
                    iniciarContagemERedirecionar('dashboard.html');
                } else {
                    // FRASE CURTA E LIMPA
                    mostrarAvisoLogin('sucesso', 'Parabéns, você está em dia com seu plano!', 'Acesso liberado ao painel da sua pousada.');
                    iniciarContagemERedirecionar('dashboard.html');
                }

            } catch(err){
                console.error("Erro no login:", err);
                alert("Ocorreu um erro ao tentar realizar o login.");
                btn.disabled = false;
                btn.innerText = 'Entrar';
            }
        });
    </script>
</body>
</html>
