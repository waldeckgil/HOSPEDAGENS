<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gestão de Suítes</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <!-- Navegação Superior -->
    <nav class="bg-white shadow-md p-6 mb-8 rounded-2xl flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="flex flex-wrap gap-6 font-bold text-gray-700 items-center">
            <a href="dashboard.html" class="text-blue-600 border-b-2 border-blue-600 pb-1">Gestão de Suítes</a>
            <a href="reservas.html" class="hover:text-blue-600 transition">Ver Reservas (Pendentes)</a>
            <a href="configurar-pousada.html" class="hover:text-blue-600 transition">Minha Pousada</a>
            <button onclick="copiarLinkVitrine()" class="bg-emerald-100 text-emerald-800 hover:bg-emerald-200 px-3 py-1.5 rounded-xl text-sm transition font-semibold flex items-center gap-1.5">
                🔗 Copiar Link da Vitrine
            </button>
            <a id="link-ver-vitrine" href="#" target="_blank" class="bg-blue-50 text-blue-700 hover:bg-blue-100 px-3 py-1.5 rounded-xl text-sm transition font-semibold flex items-center gap-1.5">
                👁️ Ver Vitrine (Visão Hóspede)
            </a>
        </div>
        <div class="flex items-center gap-4">
            <span id="titulo-pousada" class="font-bold text-gray-800">Carregando...</span>
            <button onclick="fazerLogout()" class="bg-red-600 text-white font-bold py-2 px-4 rounded-xl">Sair</button>
        </div>
    </nav>

    <!-- 🚨 CARD DE ATENÇÃO: SOLICITAÇÕES PENDENTES -->
    <div id="card-atencao-pendentes" class="hidden mb-8 bg-amber-50 border-l-8 border-amber-500 p-6 rounded-2xl shadow-md flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
        <div>
            <div class="flex items-center gap-2">
                <span class="text-2xl">🔔</span>
                <h2 class="text-xl font-bold text-amber-900">Você tem <span id="contador-pendentes">0</span> solicitação(ões) de reserva pendente(s)!</h2>
            </div>
            <p class="text-sm text-amber-700 mt-1">Há hóspedes aguardando a aprovação. Veja os detalhes abaixo:</p>
            
            <div id="lista-resumo-pendentes" class="mt-3 flex flex-wrap gap-2"></div>
        </div>
        <a href="reservas.html" class="bg-amber-600 hover:bg-amber-700 text-white font-bold px-5 py-3 rounded-xl transition shadow-sm whitespace-nowrap">
            Gerenciar Todas as Reservas &rarr;
        </a>
    </div>

    <div id="suites-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

    <!-- Modal de Edição -->
    <div id="modal-edicao" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white p-8 rounded-2xl w-full max-w-lg shadow-2xl max-h-[90vh] overflow-y-auto">
            <h2 id="modal-titulo" class="text-2xl font-bold mb-4 text-blue-600">Gerenciar Suíte</h2>
            
            <form id="form-edicao" class="space-y-3">
                <input type="hidden" id="edit-suite-id">
                
                <div>
                    <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Status Físico da Suíte</label>
                    <select id="edit-status" class="w-full p-3 border rounded-xl font-bold bg-gray-50" onchange="verificarStatusModal()">
                        <option value="Disponível">Disponível</option>
                        <option value="Ocupada">Ocupada</option>
                        <option value="Limpeza">Limpeza</option>
                        <option value="Pendente">Pendente</option>
                    </select>
                </div>

                <div id="campos-hospede-container" class="space-y-3 transition-all">
                    <div class="grid grid-cols-1 gap-2">
                        <input type="text" id="edit-hospede" placeholder="Nome Hóspede" class="p-3 border rounded-xl">
                        <input type="text" id="edit-whatsapp" placeholder="WhatsApp" class="p-3 border rounded-xl">
                        <div class="grid grid-cols-2 gap-2">
                            <input type="text" id="edit-cpf" placeholder="CPF (Opcional)" class="p-3 border rounded-xl">
                            <input type="text" id="edit-rg" placeholder="RG (Opcional)" class="p-3 border rounded-xl">
                        </div>
                        <input type="text" id="edit-endereco" placeholder="Endereço" class="p-3 border rounded-xl">
                        <input type="email" id="edit-email" placeholder="E-mail" class="p-3 border rounded-xl">
                    </div>

                    <div class="grid grid-cols-2 gap-3 pt-2">
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">Data de Check-in</label>
                            <input type="date" id="edit-checkin" class="w-full p-3 border rounded-xl bg-white">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">Data de Check-out</label>
                            <input type="date" id="edit-checkout" class="w-full p-3 border rounded-xl bg-white">
                        </div>
                    </div>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white p-3 rounded-xl font-bold mt-4 transition">Salvar Alterações</button>
                <button type="button" onclick="fecharModal()" class="w-full bg-gray-300 hover:bg-gray-400 text-gray-800 p-3 rounded-xl font-bold mt-2 transition">Cancelar</button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://evrkniykafvydnhxycit.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_TCHdTjTVsu652onrjqjptw_RUCJaqTs';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let usuarioIdAtual = null;
        let nomePousadaAtual = "nossa pousada";
        let reservasGlobaisCache = [];
        let suitesGlobaisCache = [];

        function calcularDiasRestantes(dataAlvo) {
            const hoje = new Date();
            hoje.setHours(0, 0, 0, 0);
            const [ano, mes, dia] = dataAlvo.split('-');
            const alvo = new Date(ano, mes - 1, dia);
            alvo.setHours(0, 0, 0, 0);
            return Math.round((alvo.getTime() - hoje.getTime()) / (1000 * 3600 * 24));
        }

        function obterIndicadorCheckout(checkoutStr) {
            const dias = calcularDiasRestantes(checkoutStr);
            if (dias < 0) return { texto: `⚠️ Checkout vencido há ${Math.abs(dias)} dia(s)`, classe: 'bg-red-100 text-red-700 border-red-300' };
            if (dias === 0) return { texto: `🔥 Checkout HOJE!`, classe: 'bg-orange-100 text-orange-800 border-orange-300 font-bold' };
            if (dias === 1) return { texto: `⏳ Checkout amanhã`, classe: 'bg-yellow-100 text-yellow-800 border-yellow-300' };
            return { texto: `Saída em ${dias} dias`, classe: 'bg-blue-50 text-blue-700 border-blue-200' };
        }

        function obterIndicadorProximaEstada(checkinStr) {
            const dias = calcularDiasRestantes(checkinStr);
            if (dias < 0) return { texto: `Data de check-in no passado`, classe: 'bg-gray-100 text-gray-600 border-gray-200' };
            if (dias === 0) return { texto: `🚀 Chegada HOJE!`, classe: 'bg-green-100 text-green-800 border-green-300 font-bold' };
            if (dias === 1) return { texto: `🔔 Próxima estada amanhã`, classe: 'bg-indigo-100 text-indigo-800 border-indigo-300' };
            return { texto: `Chegada em ${dias} dias`, classe: 'bg-purple-50 text-purple-700 border-purple-200' };
        }

        async function carregarPousada() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) return;
            usuarioIdAtual = user.id;

            const { data: pousada } = await supabaseClient.from('pousadas').select('nome').eq('id', user.id).single();
            if (pousada && pousada.nome) {
                nomePousadaAtual = pousada.nome;
                document.getElementById('titulo-pousada').innerText = "Pousada: " + pousada.nome;
            } else {
                document.getElementById('titulo-pousada').innerText = "Minha Pousada";
            }

            const urlVitrine = window.location.origin + `/vitrine.html?pousada_id=${user.id}`;
            document.getElementById('link-ver-vitrine').href = urlVitrine;
        }

        function copiarLinkVitrine() {
            if (!usuarioIdAtual) {
                alert("Aguarde o carregamento dos dados da pousada.");
                return;
            }
            const urlVitrine = window.location.origin + `/vitrine.html?pousada_id=${usuarioIdAtual}`;
            navigator.clipboard.writeText(urlVitrine).then(() => {
                alert("Link da vitrine copiado para a área de transferência!");
            });
        }

        async function verificarReservasPendentesDashboard() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) return;

            const { data: pendentes } = await supabaseClient
                .from('reservas')
                .select('*')
                .eq('pousada_id', user.id)
                .eq('status', 'Pendente')
                .order('criado_em', { ascending: false });

            const cardContainer = document.getElementById('card-atencao-pendentes');
            const contadorEl = document.getElementById('contador-pendentes');
            const listaResumoEl = document.getElementById('lista-resumo-pendentes');

            if (!pendentes || pendentes.length === 0) {
                cardContainer.classList.add('hidden');
                return;
            }

            cardContainer.classList.remove('hidden');
            contadorEl.innerText = pendentes.length;
            listaResumoEl.innerHTML = '';

            pendentes.forEach(res => {
                const suiteObj = suitesGlobaisCache.find(s => s.id === res.suite_id);
                const nomeSuiteStr = suiteObj ? suiteObj.nome : 'Suíte';

                let dataHoraFormatada = 'Data não informada';
                if (res.criado_em) {
                    const dataObj = new Date(res.criado_em);
                    if (!isNaN(dataObj.getTime())) {
                        dataHoraFormatada = dataObj.toLocaleDateString('pt-BR') + ' às ' + dataObj.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
                    }
                }

                listaResumoEl.innerHTML += `
                    <div class="bg-white/90 border border-amber-200 px-3 py-2 rounded-xl text-xs text-amber-900 shadow-xs flex items-center gap-2">
                        <span>👤 <strong>${res.hospede_nome || 'Hóspede'}</strong></span>
                        <span class="bg-amber-200 text-amber-900 px-2 py-0.5 rounded font-bold">${nomeSuiteStr}</span>
                        <span class="text-amber-600">•</span>
                        <span class="text-gray-600">🕒 ${dataHoraFormatada}</span>
                    </div>
                `;
            });
        }

        function formatarDataSimples(dataStr) {
            if (!dataStr) return '';
            const partes = dataStr.split('-');
            if (partes.length === 3) return `${partes[2]}/${partes[1]}/${partes[0]}`;
            return dataStr;
        }

        function gerarLinkWhatsApp(whats, nomeHospede, checkin, checkout) {
            if (!whats) return '#';
            const apenasNumeros = whats.replace(/\D/g, '');
            let numeroFinal = apenasNumeros;
            if (numeroFinal.length <= 11 && !numeroFinal.startsWith('55')) numeroFinal = '55' + numeroFinal;
            const nomeCliente = nomeHospede ? nomeHospede.trim() : 'Hóspede';
            let textoMensagem = `Olá ${nomeCliente}, agradecemos o contato! Estamos entrando em contato sobre a sua solicitação de reserva na ${nomePousadaAtual}`;
            if (checkin && checkout) textoMensagem += `, para o período de ${formatarDataSimples(checkin)} até ${formatarDataSimples(checkout)}.`;
            return `https://wa.me/${numeroFinal}?text=${encodeURIComponent(textoMensagem)}`;
        }

        async function carregarDashboard() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) { window.location.href = 'index.html'; return; }

            await carregarPousada();

            const { data: suites, error } = await supabaseClient.from('suites').select('*').eq('pousada_id', user.id);
            if (error) return;
            suitesGlobaisCache = suites || [];

            const { data: reservas } = await supabaseClient.from('reservas').select('*').eq('pousada_id', user.id);
            reservasGlobaisCache = reservas || [];

            await verificarReservasPendentesDashboard();

            const container = document.getElementById('suites-container');
            container.innerHTML = '';

            if (!suitesGlobaisCache || suitesGlobaisCache.length === 0) {
                container.innerHTML = '<p class="text-gray-600 col-span-3 text-center">Nenhuma suíte cadastrada.</p>';
                return;
            }

            suitesGlobaisCache.forEach(suite => {
                const reservasDaSuite = reservasGlobaisCache.filter(r => r.suite_id === suite.id && r.status !== 'Cancelada' && r.status !== 'Recusada');
                
                const aprovadasDaSuite = reservasDaSuite.filter(r => r.status === 'Aprovada');
                const pendentesDaSuite = reservasDaSuite.filter(r => r.status === 'Pendente');

                // Conta o total de cards que esta suíte vai gerar (todas as aprovadas + todas as pendentes, ou card padrão disponível)
                let totalCardsDestaSuite = aprovadasDaSuite.length + pendentesDaSuite.length;
                if (totalCardsDestaSuite === 0) totalCardsDestaSuite = 1;

                let contadorCardAtual = 1;

                // 1. 🚀 SE HOUVER RESERVAS APROVADAS, RENDERIZA UM CARD PARA CADA UMA DELAS!
                if (aprovadasDaSuite.length > 0) {
                    aprovadasDaSuite.forEach(aprovada => {
                        const indicador = obterIndicadorCheckout(aprovada.checkout);
                        const linkZap = gerarLinkWhatsApp(aprovada.whatsapp_hospede, aprovada.hospede_nome, aprovada.checkin, aprovada.checkout);
                        const sufixoTitulo = totalCardsDestaSuite > 1 ? ` (${contadorCardAtual++})` : '';

                        container.innerHTML += `
                            <div class="p-6 rounded-2xl shadow-md border-l-8 bg-gray-100 border-gray-600 text-gray-900 flex flex-col justify-between transition hover:shadow-lg cursor-pointer bg-white" 
                                 onclick="abrirModal('${suite.id}', '${suite.nome}', 'Ocupada')">
                                <div>
                                    <div class="flex justify-between items-start mb-2">
                                        <h2 class="text-xl font-bold text-gray-800">${suite.nome}${sufixoTitulo}</h2>
                                        <span class="px-3 py-1 rounded-full text-xs font-extrabold uppercase shadow-sm bg-gray-300 text-gray-800">
                                            Reservada / Ocupada
                                        </span>
                                    </div>

                                    <div class="mt-2 inline-block px-3 py-1 rounded-lg border text-xs font-semibold ${indicador.classe}">${indicador.texto}</div>

                                    <div class="mt-4 pt-3 border-t border-black/10 text-sm space-y-1.5">
                                        <p class="flex items-center gap-1.5"><span class="font-semibold text-gray-600">Hóspede:</span> <span class="font-bold text-gray-900">${aprovada.hospede_nome}</span></p>
                                        <p class="flex items-center gap-1.5"><span class="font-semibold text-gray-600">WhatsApp:</span> <a href="${linkZap}" target="_blank" onclick="event.stopPropagation();" class="text-emerald-700 font-bold bg-emerald-50 px-2 py-0.5 rounded-lg border border-emerald-200">💬 ${aprovada.whatsapp_hospede || 'Não informado'}</a></p>
                                        <div class="grid grid-cols-2 gap-2 mt-2 pt-2 border-t border-black/5 text-xs">
                                            <p><span class="text-gray-500">Check-in:</span> <strong class="text-gray-800">${formatarDataSimples(aprovada.checkin)}</strong></p>
                                            <p><span class="text-gray-500">Check-out:</span> <strong class="text-gray-800">${formatarDataSimples(aprovada.checkout)}</strong></p>
                                        </div>
                                    </div>
                                </div>

                                <div class="mt-5 pt-3 flex justify-end">
                                    <span class="text-xs font-bold text-blue-600 hover:underline">
                                        Gerenciar / Editar Suíte &rarr;
                                    </span>
                                </div>
                            </div>`;
                    });
                } else if (pendentesDaSuite.length === 0) {
                    // 2. SE NÃO TEM APROVADAS NEM PENDENTES, EXIBE O CARD NORMAL DE DISPONÍVEL/LIMPEZA
                    let statusExibicao = suite.status;
                    let proximaReserva = null;
                    const hojeStr = new Date().toISOString().split('T')[0];
                    const futuras = reservasDaSuite.filter(r => r.status === 'Aprovada' && r.checkin >= hojeStr);
                    if (futuras.length > 0) {
                        futuras.sort((a, b) => a.checkin.localeCompare(b.checkin));
                        proximaReserva = futuras[0];
                    }

                    const corClasses = {
                        'Disponível': 'bg-green-50 border-green-500 text-green-900', 
                        'Limpeza': 'bg-red-50 border-red-500 text-red-900', 
                        'Pendente': 'bg-yellow-50 border-yellow-500 text-yellow-900'
                    };

                    let indicadorHtml = '';
                    if (statusExibicao === 'Disponível' && proximaReserva && proximaReserva.checkin) {
                        const indicadorProxima = obterIndicadorProximaEstada(proximaReserva.checkin);
                        indicadorHtml = `
                            <div class="mt-3 p-2 bg-indigo-50/70 border border-indigo-200 rounded-xl text-xs space-y-1">
                                <p class="font-bold text-indigo-900">📅 Próxima Estada: ${proximaReserva.hospede_nome}</p>
                                <div class="inline-block px-2.5 py-0.5 rounded-md border text-xs font-semibold ${indicadorProxima.classe}">
                                    ${indicadorProxima.texto} (Check-in: ${formatarDataSimples(proximaReserva.checkin)})
                                </div>
                            </div>
                        `;
                    }

                    container.innerHTML += `
                        <div class="p-6 rounded-2xl shadow-md border-l-8 ${corClasses[statusExibicao] || 'bg-white border-gray-300'} flex flex-col justify-between transition hover:shadow-lg cursor-pointer bg-white" 
                             onclick="abrirModal('${suite.id}', '${suite.nome}', '${suite.status}')">
                            <div>
                                <div class="flex justify-between items-start mb-2">
                                    <h2 class="text-xl font-bold text-gray-800">${suite.nome}</h2>
                                    <span class="px-3 py-1 rounded-full text-xs font-extrabold uppercase shadow-sm ${
                                        statusExibicao === 'Disponível' ? 'bg-green-200 text-green-800' :
                                        statusExibicao === 'Limpeza' ? 'bg-red-200 text-red-800' : 'bg-yellow-200 text-yellow-800'
                                    }">
                                        ${statusExibicao}
                                    </span>
                                </div>

                                ${indicadorHtml}
                                <div class="mt-4 pt-3 border-t border-black/10 text-xs text-gray-500 italic">
                                    ${!proximaReserva ? 'Nenhuma reserva ativa vinculada no momento.' : ''}
                                </div>
                            </div>

                            <div class="mt-5 pt-3 flex justify-end">
                                <span class="text-xs font-bold text-blue-600 hover:underline">
                                    Gerenciar / Editar Suíte &rarr;
                                </span>
                            </div>
                        </div>`;
                }

                // 3. 🚀 CARDS PARA CADA SOLICITAÇÃO PENDENTE (COM NUMERAÇÃO)
                pendentesDaSuite.forEach((pend, idx) => {
                    const linkZapPend = gerarLinkWhatsApp(pend.whatsapp_hospede, pend.hospede_nome, pend.checkin, pend.checkout);
                    const sufixoTitulo = totalCardsDestaSuite > 1 ? ` (${contadorCardAtual++})` : '';

                    container.innerHTML += `
                        <div class="p-6 rounded-2xl shadow-md border-l-8 border-amber-500 bg-amber-50 flex flex-col justify-between transition hover:shadow-lg">
                            <div>
                                <div class="flex justify-between items-start mb-2">
                                    <h2 class="text-xl font-bold text-amber-900">${suite.nome}${sufixoTitulo}</h2>
                                    <span class="px-3 py-1 rounded-full text-xs font-extrabold uppercase shadow-sm bg-amber-200 text-amber-900">
                                        Solicitação Pendente
                                    </span>
                                </div>

                                <div class="mt-2 inline-block px-3 py-1 rounded-lg border bg-amber-100 text-amber-800 border-amber-300 text-xs font-semibold">
                                    ⏳ Aguardando sua aprovação
                                </div>

                                <div class="mt-4 pt-3 border-t border-amber-200 text-sm space-y-1.5">
                                    <p class="flex items-center gap-1.5"><span class="font-semibold text-amber-800">Hóspede:</span> <span class="font-bold text-gray-900">${pend.hospede_nome}</span></p>
                                    <p class="flex items-center gap-1.5"><span class="font-semibold text-amber-800">WhatsApp:</span> <a href="${linkZapPend}" target="_blank" class="text-emerald-700 font-bold bg-white px-2 py-0.5 rounded-lg border border-emerald-200">💬 ${pend.whatsapp_hospede || 'Não informado'}</a></p>
                                    <div class="grid grid-cols-2 gap-2 mt-2 pt-2 border-t border-amber-200 text-xs">
                                        <p><span class="text-amber-800">Check-in:</span> <strong class="text-gray-900">${formatarDataSimples(pend.checkin)}</strong></p>
                                        <p><span class="text-amber-800">Check-out:</span> <strong class="text-gray-900">${formatarDataSimples(pend.checkout)}</strong></p>
                                    </div>
                                </div>
                            </div>

                            <div class="mt-5 pt-3 border-t border-amber-200 flex gap-2">
                                <button type="button" onclick="mudarStatusReserva('${pend.id}', 'Aprovada')" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-3 rounded-xl shadow-sm transition text-xs">✔ Aprovar</button>
                                <button type="button" onclick="mudarStatusReserva('${pend.id}', 'Recusada')" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-3 rounded-xl shadow-sm transition text-xs">✖ Recusar</button>
                            </div>
                        </div>
                    `;
                });
            });
        }
        
        function abrirModal(id, nome, status) {
            document.getElementById('edit-suite-id').value = id;
            document.getElementById('edit-status').value = status;
            document.getElementById('modal-titulo').innerText = "Gerenciar Suíte: " + nome;

            const aprovadaDestaSuite = reservasGlobaisCache.find(r => r.suite_id === id && r.status === 'Aprovada');
            if (aprovadaDestaSuite) {
                document.getElementById('edit-hospede').value = aprovadaDestaSuite.hospede_nome || '';
                document.getElementById('edit-whatsapp').value = aprovadaDestaSuite.whatsapp_hospede || '';
                document.getElementById('edit-cpf').value = aprovadaDestaSuite.cpf || '';
                document.getElementById('edit-rg').value = aprovadaDestaSuite.rg || '';
                document.getElementById('edit-endereco').value = aprovadaDestaSuite.endereco || '';
                document.getElementById('edit-email').value = aprovadaDestaSuite.email || '';
                document.getElementById('edit-checkin').value = aprovadaDestaSuite.checkin || '';
                document.getElementById('edit-checkout').value = aprovadaDestaSuite.checkout || '';
            } else {
                document.getElementById('edit-hospede').value = '';
                document.getElementById('edit-whatsapp').value = '';
                document.getElementById('edit-cpf').value = '';
                document.getElementById('edit-rg').value = '';
                document.getElementById('edit-endereco').value = '';
                document.getElementById('edit-email').value = '';
                document.getElementById('edit-checkin').value = '';
                document.getElementById('edit-checkout').value = '';
            }
            
            verificarStatusModal();
            document.getElementById('modal-edicao').classList.remove('hidden');
        }

        async function mudarStatusReserva(reservaId, novoStatus) {
            const { error } = await supabaseClient
                .from('reservas')
                .update({ status: novoStatus })
                .eq('id', reservaId);

            if (error) {
                alert("Erro ao atualizar reserva: " + error.message);
                return;
            }

            if (novoStatus === 'Aprovada') {
                const reservaObj = reservasGlobaisCache.find(r => r.id === reservaId);
                if (reservaObj) {
                    await supabaseClient.from('suites').update({ status: 'Ocupada' }).eq('id', reservaObj.suite_id);
                }
            }

            alert(`Reserva ${novoStatus.toLowerCase()} com sucesso!`);
            carregarDashboard();
        }

        function verificarStatusModal() {
            const status = document.getElementById('edit-status').value;
            const containerCampos = document.getElementById('campos-hospede-container');
            if (status === 'Disponível' || status === 'Limpeza') {
                containerCampos.classList.add('opacity-50');
            } else {
                containerCampos.classList.remove('opacity-50');
            }
        }

        function fecharModal() { document.getElementById('modal-edicao').classList.add('hidden'); }

        document.getElementById('form-edicao').onsubmit = async (e) => {
            e.preventDefault();
            const status = document.getElementById('edit-status').value;
            const suiteId = document.getElementById('edit-suite-id').value;
            
            await supabaseClient.from('suites').update({ status }).eq('id', suiteId);

            if (status === 'Disponível' || status === 'Limpeza') {
                await supabaseClient.from('reservas').update({ status: 'Cancelada' }).eq('suite_id', suiteId).eq('status', 'Pendente');
            }

            alert("Alterações salvas com sucesso!"); 
            fecharModal(); 
            carregarDashboard();
        };

        async function fazerLogout() { 
            await supabaseClient.auth.signOut(); 
            window.location.href = 'index.html'; 
        }
        
        carregarDashboard();
    </script>
</body>
</html>
