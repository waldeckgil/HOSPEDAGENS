<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gestão de Hóspedes</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <!-- Navegação Superior Padrão -->
    <nav class="bg-white shadow-md p-6 mb-8 rounded-2xl flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="flex flex-wrap gap-6 font-bold text-gray-700 items-center">
            <a href="dashboard.html" class="hover:text-blue-600 transition">Gestão de Suítes</a>
            <a href="reservas.html" class="hover:text-blue-600 transition">Ver Reservas (Pendentes)</a>
            <a href="hospedes.html" class="text-blue-600 border-b-2 border-blue-600 pb-1">Gestão de Hóspedes</a>
            <a href="configurar-pousada.html" class="hover:text-blue-600 transition">Minha Pousada</a>
        </div>
        <div class="flex items-center gap-4">
            <span id="titulo-pousada" class="font-bold text-gray-800">Carregando...</span>
            <button onclick="fazerLogout()" class="bg-red-600 text-white font-bold py-2 px-4 rounded-xl">Sair</button>
        </div>
    </nav>

    <!-- ÁREA DE BUSCA INTELIGENTE -->
    <div class="bg-white p-6 rounded-2xl shadow-md mb-8">
        <h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
            🔍 Consulta Inteligente de Hóspedes
        </h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
            <div>
                <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Buscar por Nome, CPF ou E-mail</label>
                <input type="text" id="filtro-texto" placeholder="Digite parte do nome, CPF..." class="w-full p-3 border rounded-xl bg-gray-50 text-sm font-medium">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Período Inicial (Reserva/Estadia)</label>
                <input type="date" id="filtro-inicio" class="w-full p-3 border rounded-xl bg-gray-50 text-sm font-medium">
            </div>
            <div class="flex gap-2">
                <div class="w-full">
                    <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Período Final</label>
                    <input type="date" id="filtro-fim" class="w-full p-3 border rounded-xl bg-gray-50 text-sm font-medium">
                </div>
            </div>
        </div>
        <div class="flex gap-3 mt-4">
            <button onclick="carregarHistoricoHospedes()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-3 rounded-xl transition shadow-sm text-sm flex items-center gap-2">
                🔍 Pesquisar Histórico
            </button>
            <button onclick="limparFiltros()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold px-4 py-3 rounded-xl transition text-sm">
                Limpar Filtros
            </button>
        </div>
    </div>

    <!-- TABELA DE RESULTADOS DO HISTÓRICO -->
    <div class="bg-white rounded-2xl shadow-md overflow-hidden">
        <div class="p-6 border-b border-gray-100 flex justify-between items-center">
            <h3 class="font-bold text-gray-800 text-lg">Histórico de Hóspedes e Estadias</h3>
            <span id="contador-resultados" class="text-xs bg-blue-50 text-blue-700 font-bold px-3 py-1 rounded-full">0 registros encontrados</span>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50 text-gray-600 uppercase text-xs tracking-wider border-b border-gray-200">
                        <th class="p-4 font-bold">Hóspede / Contato</th>
                        <th class="p-4 font-bold">Documentos</th>
                        <th class="p-4 font-bold">Endereço</th>
                        <th class="p-4 font-bold">Período da Estadia</th>
                        <th class="p-4 font-bold">Status</th>
                        <th class="p-4 font-bold">Data da Reserva</th>
                    </tr>
                </thead>
                <tbody id="tabela-hospedes-corpo" class="divide-y divide-gray-100 text-sm text-gray-700">
                    <tr>
                        <td colspan="6" class="p-8 text-center text-gray-500 italic">Carregando histórico de hóspedes...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://evrkniykafvydnhxycit.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_TCHdTjTVsu652onrjqjptw_RUCJaqTs';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let usuarioIdAtual = null;

        async function inicializarPagina() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) { window.location.href = 'index.html'; return; }
            usuarioIdAtual = user.id;

            const { data: pousada } = await supabaseClient.from('pousadas').select('nome').eq('id', user.id).single();
            if (pousada && pousada.nome) {
                document.getElementById('titulo-pousada').innerText = "Pousada: " + pousada.nome;
            } else {
                document.getElementById('titulo-pousada').innerText = "Minha Pousada";
            }

            carregarHistoricoHospedes();
        }

        function formatarDataSimples(dataStr) {
            if (!dataStr) return '-';
            const partes = dataStr.split('-');
            if (partes.length === 3) return `${partes[2]}/${partes[1]}/${partes[0]}`;
            return dataStr;
        }

        function formatarDataHora(timestampStr) {
            if (!timestampStr) return '-';
            const dataObj = new Date(timestampStr);
            if (isNaN(dataObj.getTime())) return timestampStr;
            const dia = String(dataObj.getDate()).padStart(2, '0');
            const mes = String(dataObj.getMonth() + 1).padStart(2, '0');
            const ano = dataObj.getFullYear();
            const hora = String(dataObj.getHours()).padStart(2, '0');
            const min = String(dataObj.getMinutes()).padStart(2, '0');
            return `${dia}/${mes}/${ano} às ${hora}:${min}`;
        }

        async function carregarHistoricoHospedes() {
            if (!usuarioIdAtual) return;

            let query = supabaseClient
                .from('reservas')
                .select('*')
                .eq('pousada_id', usuarioIdAtual)
                .order('criado_em', { ascending: false });

            const textoBusca = document.getElementById('filtro-texto').value.trim();
            const dataInicio = document.getElementById('filtro-inicio').value;
            const dataFim = document.getElementById('filtro-fim').value;

            const { data: reservas, error } = await query;
            
            if (error) {
                console.error("Erro ao buscar histórico:", error);
                return;
            }

            let filtrados = reservas || [];

            // Filtro inteligente local por texto (Nome, CPF, E-mail)
            if (textoBusca !== '') {
                const buscaLower = textoBusca.toLowerCase();
                filtrados = filtrados.filter(r => 
                    (r.hospede_nome && r.hospede_nome.toLowerCase().includes(buscaLower)) ||
                    (r.cpf && r.cpf.toLowerCase().includes(buscaLower)) ||
                    (r.email && r.email.toLowerCase().includes(buscaLower))
                );
            }

            // Filtro por período de check-in / check-out
            if (dataInicio) {
                filtrados = filtrados.filter(r => r.checkout >= dataInicio);
            }
            if (dataFim) {
                filtrados = filtrados.filter(r => r.checkin <= dataFim);
            }

            const tbody = document.getElementById('tabela-hospedes-corpo');
            document.getElementById('contador-resultados').innerText = `${filtrados.length} registro(s) encontrado(s)`;

            if (filtrados.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-gray-500 italic">Nenhum hóspede encontrado com os critérios informados.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            filtrados.forEach(r => {
                let badgeStatus = 'bg-gray-100 text-gray-800';
                if (r.status === 'Aprovada') badgeStatus = 'bg-green-100 text-green-800 font-bold';
                else if (r.status === 'Pendente') badgeStatus = 'bg-amber-100 text-amber-800 font-bold';
                else if (r.status === 'Finalizada') badgeStatus = 'bg-blue-100 text-blue-800';
                else if (r.status === 'Recusada' || r.status === 'Cancelada') badgeStatus = 'bg-red-100 text-red-800';

                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50 transition">
                        <td class="p-4">
                            <div class="font-bold text-gray-900">${r.hospede_nome || 'Não informado'}</div>
                            <div class="text-xs text-emerald-700 font-medium">💬 ${r.whatsapp_hospede || 'Sem WhatsApp'}</div>
                            <div class="text-xs text-gray-500">${r.email || 'Sem e-mail'}</div>
                        </td>
                        <td class="p-4 text-xs">
                            <div><strong class="text-gray-600">CPF:</strong> ${r.cpf || '-'}</div>
                            <div><strong class="text-gray-600">RG:</strong> ${r.rg || '-'}</div>
                        </td>
                        <td class="p-4 text-xs text-gray-600 max-w-xs truncate">
                            ${r.endereco || 'Não informado'}
                        </td>
                        <td class="p-4 text-xs font-semibold">
                            <div>Check-in: <span class="text-gray-900">${formatarDataSimples(r.checkin)}</span></div>
                            <div>Check-out: <span class="text-gray-900">${formatarDataSimples(r.checkout)}</span></div>
                        </td>
                        <td class="p-4">
                            <span class="px-2.5 py-1 rounded-full text-xs uppercase ${badgeStatus}">${r.status}</span>
                        </td>
                        <td class="p-4 text-xs text-gray-500">
                            ${formatarDataHora(r.criado_em)}
                        </td>
                    </tr>
                `;
            });
        }

        function limparFiltros() {
            document.getElementById('filtro-texto').value = '';
            document.getElementById('filtro-inicio').value = '';
            document.getElementById('filtro-fim').value = '';
            carregarHistoricoHospedes();
        }

        async function fazerLogout() { 
            await supabaseClient.auth.signOut(); 
            window.location.href = 'index.html'; 
        }

        // Disparar busca ao pressionar Enter no campo de texto
        document.getElementById('filtro-texto').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') carregarHistoricoHospedes();
        });

        inicializarPagina();
    </script>
</body>
</html>
