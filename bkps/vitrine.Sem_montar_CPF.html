<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Vitrine de Reservas - Pousada</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-5xl mx-auto space-y-8">
        
        <!-- CABEÇALHO DA VITRINE -->
        <div class="bg-white p-8 rounded-3xl shadow-md text-center">
            <h1 id="nome-pousada-vitrine" class="text-3xl font-bold text-blue-600 mb-2">Carregando Pousada...</h1>
            <p class="text-sm text-gray-600">Escolha o período da sua estadia e consulte as suítes disponíveis.</p>
            
            <!-- BUSCA DE DISPONIBILIDADE -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-6 bg-gray-50 p-6 rounded-2xl border border-gray-200">
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Check-in</label>
                    <input type="date" id="filtro-checkin" class="w-full p-3 border rounded-xl font-medium bg-white text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Check-out</label>
                    <input type="date" id="filtro-checkout" class="w-full p-3 border rounded-xl font-medium bg-white text-sm">
                </div>
                <div class="flex items-end">
                    <button onclick="consultarDisponibilidade()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-xl transition text-sm shadow-md">
                        Consultar Disponibilidade
                    </button>
                </div>
            </div>
        </div>

        <!-- LISTAGEM DE SUÍTES DISPONÍVEIS -->
        <div class="bg-white p-8 rounded-3xl shadow-md">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">Suítes Disponíveis para o Período</h2>
            <div id="lista-suites-vitrine" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <p class="text-gray-500 text-sm">Informe as datas de check-in e check-out acima e clique em consultar.</p>
            </div>
        </div>

    </div>

    <!-- MODAL DE RESERVA -->
    <div id="modal-reserva" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white p-8 rounded-3xl max-w-lg w-full shadow-2xl space-y-6">
            <div class="flex justify-between items-center border-b pb-4">
                <h3 class="text-xl font-bold text-gray-900" id="modal-titulo-suite">Reservar Suíte</h3>
                <button onclick="fecharModal()" class="text-gray-400 hover:text-gray-600 font-bold text-lg">✕</button>
            </div>
            
            <div id="modal-resumo-estadia" class="bg-blue-50 p-4 rounded-2xl text-sm text-blue-900 space-y-1">
                <!-- Preenchido via JS -->
            </div>

            <form id="form-fazer-reserva" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Seu Nome Completo</label>
                    <input type="text" id="hospede-nome" required placeholder="Ex: Maria da Silva" class="w-full p-3 border rounded-xl font-medium text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Seu E-mail</label>
                    <input type="email" id="hospede-email" required placeholder="Ex: maria@email.com" class="w-full p-3 border rounded-xl font-medium text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Seu WhatsApp / Telefone</label>
                    <input type="text" id="hospede-telefone" required placeholder="Ex: (21) 99999-9999" class="w-full p-3 border rounded-xl font-medium text-sm">
                </div>
                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="fecharModal()" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold px-5 py-2.5 rounded-xl text-sm transition">Cancelar</button>
                    <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-2.5 rounded-xl text-sm transition shadow-md">Confirmar Reserva</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://evrkniykafvydnhxycit.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_TCHdTjTVsu652onrjqjptw_RUCJaqTs';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let pousadaIdGlobal = null;
        let suiteSelecionadaParaReserva = null;
        let dadosReservaCalculados = null;

        // Captura o ID da pousada via parâmetro da URL (?pousada_id=...)
        function obterPousadaIdDaUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('pousada_id');
        }

        async function inicializarVitrine() {
            pousadaIdGlobal = obterPousadaIdDaUrl();

            if (!pousadaIdGlobal) {
                // Se não vier na URL, busca a primeira cadastrada como fallback
                const { data: pousadas } = await supabaseClient.from('pousadas').select('*').limit(1);
                if (pousadas && pousadas.length > 0) {
                    pousadaIdGlobal = pousadas[0].id;
                }
            }

            if (pousadaIdGlobal) {
                const { data: pousada } = await supabaseClient.from('pousadas').select('*').eq('id', pousadaIdGlobal).single();
                if (pousada) {
                    // Exibe apenas o nome puro sem duplicar a palavra Pousada
                    document.getElementById('nome-pousada-vitrine').innerText = pousada.nome;
                } else {
                    document.getElementById('nome-pousada-vitrine').innerText = "Pousada não encontrada";
                }
            } else {
                document.getElementById('nome-pousada-vitrine').innerText = "Nenhuma pousada selecionada";
            }
        }

        async function calcularTotalEstadia(suiteId, valorDiariaBase, checkinStr, checkoutStr) {
            const d1 = new Date(checkinStr + 'T00:00:00');
            const d2 = new Date(checkoutStr + 'T00:00:00');
            
            const { data: tarifas } = await supabaseClient
                .from('tarifas_especiais')
                .select('*')
                .eq('pousada_id', pousadaIdGlobal)
                .or(`suite_id.eq.${suiteId},suite_id.is.null`);

            let valorTotal = 0;
            let atual = new Date(d1);
            let noites = 0;
            const baseDiaria = Number(valorDiariaBase || 0);
            let detalheDiarias = [];

            const nomesDias = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];

            while (atual < d2) {
                noites++;
                const dataFormatada = atual.toISOString().split('T')[0];
                const diaDaSemana = atual.getDay(); 
                let diariaAplicada = baseDiaria;
                let regraAplicadaDescricao = 'Tarifa Padrão';

                if (tarifas && tarifas.length > 0) {
                    const regra = tarifas.find(t => {
                        const dentroDoPeriodo = dataFormatada >= t.data_inicio && dataFormatada <= t.data_fim;
                        if (!dentroDoPeriodo) return false;

                        if (t.dias_semana && t.dias_semana.length > 0) {
                            return t.dias_semana.includes(diaDaSemana);
                        }
                        return true;
                    });

                    if (regra) {
                        if (regra.tipo_ajuste === 'percentual') {
                            diariaAplicada = baseDiaria + (baseDiaria * (Number(regra.valor_especial) / 100));
                        } else {
                            diariaAplicada = Number(regra.valor_especial);
                        }
                        regraAplicadaDescricao = regra.descricao || 'Tarifa Especial';
                    }
                }

                detalheDiarias.push({
                    data: dataFormatada.split('-').reverse().join('/'),
                    diaSemana: nomesDias[diaDaSemana],
                    valor: diariaAplicada,
                    descricao: regraAplicadaDescricao
                });

                valorTotal += diariaAplicada;
                atual.setDate(atual.getDate() + 1);
            }

            if (noites === 0) noites = 1;
            if (valorTotal === 0) valorTotal = baseDiaria * noites;

            return { valorTotal, noites, detalheDiarias };
        }

        async function consultarDisponibilidade() {
            const checkin = document.getElementById('filtro-checkin').value;
            const checkout = document.getElementById('filtro-checkout').value;

            if (!checkin || !checkout) {
                alert("Por favor, preencha as datas de Check-in e Check-out.");
                return;
            }

            if (checkin >= checkout) {
                alert("A data de check-out deve ser posterior à data de check-in.");
                return;
            }

            const container = document.getElementById('lista-suites-vitrine');
            container.innerHTML = '<p class="text-gray-500 text-sm col-span-2">Calculando melhores tarifas e verificando disponibilidade...</p>';

            const { data: suites, error } = await supabaseClient
                .from('suites')
                .select('*')
                .eq('pousada_id', pousadaIdGlobal);

            if (error || !suites || suites.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-sm col-span-2">Nenhuma suíte encontrada para esta pousada.</p>';
                return;
            }

            container.innerHTML = '';

            for (const suite of suites) {
                const calculo = await calcularTotalEstadia(suite.id, suite.valor_diaria, checkin, checkout);

                // Montar o HTML com o detalhamento diário colapsável ou visível no card
                let htmlDetalhes = '';
                calculo.detalheDiarias.forEach(d => {
                    const isEspecial = d.descricao !== 'Tarifa Padrão';
                    htmlDetalhes += `
                        <div class="flex justify-between items-center text-xs py-1 border-b border-gray-100 last:border-none">
                            <span class="text-gray-600">${d.data} (${d.diaSemana}) - <span class="${isEspecial ? 'text-amber-600 font-semibold' : 'text-gray-500'}">${d.descricao}</span></span>
                            <span class="font-bold ${isEspecial ? 'text-amber-600' : 'text-gray-800'}">R$ ${d.valor.toFixed(2)}</span>
                        </div>
                    `;
                });

                container.innerHTML += `
                    <div class="bg-gray-50 border border-gray-200 p-6 rounded-2xl flex flex-col justify-between gap-4">
                        <div>
                            <h3 class="text-lg font-bold text-gray-900">${suite.nome}</h3>
                            <p class="text-xs text-gray-500 mt-1">Status: ${suite.status || 'Disponível'}</p>
                            <p class="text-sm font-semibold text-blue-600 mt-2">Diária Base: R$ ${Number(suite.valor_diaria || 0).toFixed(2)}</p>
                            
                            <!-- DETALHAMENTO DIÁRIO -->
                            <div class="mt-4 bg-white p-3 rounded-xl border border-gray-200 space-y-1">
                                <p class="text-[11px] font-bold text-gray-500 uppercase tracking-wide mb-2">Detalhamento das Diárias:</p>
                                ${htmlDetalhes}
                            </div>
                        </div>

                        <div class="border-t pt-4 flex items-center justify-between">
                            <div>
                                <span class="text-xs text-gray-500 block">Total para ${calculo.noites} noite(s):</span>
                                <span class="text-xl font-extrabold text-emerald-600">R$ ${calculo.valorTotal.toFixed(2)}</span>
                            </div>
                            <button onclick='abrirModalReserva(${JSON.stringify(suite)}, "${checkin}", "${checkout}", ${calculo.valorTotal}, ${calculo.noites})' class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-5 py-2.5 rounded-xl text-sm transition shadow-sm">
                                Reservar
                            </button>
                        </div>
                    </div>
                `;
            }
        }

        function abrirModalReserva(suite, checkin, checkout, valorTotal, noites) {
            suiteSelecionadaParaReserva = suite;
            dadosReservaCalculados = { checkin, checkout, valorTotal, noites };

            document.getElementById('modal-titulo-suite').innerText = "Reservar: " + suite.nome;
            document.getElementById('modal-resumo-estadia').innerHTML = `
                <p><strong>Período:</strong> ${checkin.split('-').reverse().join('/')} até ${checkout.split('-').reverse().join('/')} (${noites} noites)</p>
                <p><strong>Valor Total da Estadia:</strong> R$ ${valorTotal.toFixed(2)}</p>
            `;
            document.getElementById('modal-reserva').classList.remove('hidden');
        }

        function fecharModal() {
            document.getElementById('modal-reserva').classList.add('hidden');
            document.getElementById('form-fazer-reserva').reset();
        }

        document.getElementById('form-fazer-reserva').onsubmit = async (e) => {
            e.preventDefault();
            const nome = document.getElementById('hospede-nome').value;
            const email = document.getElementById('hospede-email').value;
            const telefone = document.getElementById('hospede-telefone').value;

            const { error } = await supabaseClient.from('reservas').insert([{
                pousada_id: pousadaIdGlobal,
                suite_id: suiteSelecionadaParaReserva.id,
                hospede_nome: nome,
                hospede_email: email,
                hospede_telefone: telefone,
                data_checkin: dadosReservaCalculados.checkin,
                data_checkout: dadosReservaCalculados.checkout,
                valor_total: dadosReservaCalculados.valorTotal,
                status: 'Confirmada'
            }]);

            if (error) {
                alert("Erro ao realizar reserva: " + error.message);
                return;
            }

            alert("Reserva realizada com sucesso!");
            fecharModal();
        };

        inicializarVitrine();
    </script>
</body>
</html>
