<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel 360 - Gestão Financeira</title>
    <!-- Tailwind CSS para estilização rápida e moderna -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans antialiased">

    <div class="flex h-screen bg-gray-100">
        <!-- Conteúdo Principal -->
        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 p-6">
            <div class="max-w-7xl mx-auto">
                
                <!-- Cabeçalho Dinâmico -->
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                    <div class="flex items-center gap-4">
                        <!-- Botão de Voltar para o Dashboard -->
                        <a href="dashboard.html" class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-4 py-2 rounded-xl text-sm font-bold transition flex items-center gap-2 shadow-sm">
                            <span>←</span> Voltar
                        </a>
                        <div>
                            <h1 class="text-2xl font-bold text-gray-800">Gestão Financeira</h1>
                            <p id="nomePousadaLogada" class="text-sm font-semibold text-blue-600 mt-0.5">Carregando pousada...</p>
                        </div>
                    </div>

                    <!-- Filtros (Status, Datas e Botão) -->
                    <div class="flex flex-wrap items-center gap-3">
                        <div class="flex flex-col">
                            <label class="text-[10px] font-bold text-gray-500 uppercase">Status</label>
                            <select id="filtroStatus" class="border rounded-lg px-3 py-2 text-sm bg-white font-medium text-gray-700">
                                <option value="Aprovada" selected>Aprovada</option>
                                <option value="Finalizada">Finalizada</option>
                                <option value="TODAS">Todas</option>
                            </select>
                        </div>
                        <div class="flex flex-col">
                            <label class="text-[10px] font-bold text-gray-500 uppercase">Data Início</label>
                            <input type="date" id="filtroInicio" class="border rounded-lg px-3 py-2 text-sm bg-white">
                        </div>
                        <div class="flex flex-col">
                            <label class="text-[10px] font-bold text-gray-500 uppercase">Data Fim</label>
                            <input type="date" id="filtroFim" class="border rounded-lg px-3 py-2 text-sm bg-white">
                        </div>
                        <div class="flex items-end">
                            <button onclick="carregarDadosFinanceiros()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-700 transition h-[38px]">Filtrar</button>
                        </div>
                    </div>
                </div>

                <!-- Cards de Resumo (KPIs Inteligentes) -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                        <p class="text-sm font-medium text-gray-500">Faturamento Bruto (Total)</p>
                        <p id="kpiFaturamento" class="text-3xl font-bold text-gray-800 mt-2">R$ 0,00</p>
                    </div>
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                        <p class="text-sm font-medium text-gray-500">Total Recebido (Caixa / Sinal)</p>
                        <p id="kpiRecebido" class="text-3xl font-bold text-green-600 mt-2">R$ 0,00</p>
                    </div>
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                        <p class="text-sm font-medium text-gray-500">Saldo Restante a Receber</p>
                        <p id="kpiSaldo" class="text-3xl font-bold text-amber-600 mt-2">R$ 0,00</p>
                    </div>
                </div>

                <!-- Tabela de Detalhamento com Enriquecimento Financeiro -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
                        <h3 class="font-semibold text-gray-800">Detalhamento Financeiro por Reserva</h3>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-50 text-gray-600 text-xs uppercase tracking-wider">
                                    <th class="py-3 px-6">Check-in / Out</th>
                                    <th class="py-3 px-6">Hóspede</th>
                                    <th class="py-3 px-6">Suíte</th>
                                    <th class="py-3 px-6">Valor Total</th>
                                    <th class="py-3 px-6">Pago (Sinal)</th>
                                    <th class="py-3 px-6">Saldo Restante</th>
                                    <th class="py-3 px-6">Status</th>
                                </tr>
                            </thead>
                            <tbody id="tabelaFinanceira" class="divide-y divide-gray-200 text-sm text-gray-700">
                                <!-- Preenchido via JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://evrkniykafvydnhxycit.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_TCHdTjTVsu652onrjqjptw_RUCJaqTs';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let usuarioIdAtual = null;
        let mapaSuitesCache = {};

        function formatarMoeda(valor) {
            if (valor === null || valor === undefined || isNaN(valor)) return 'R$ 0,00';
            return Number(valor).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function formatarDataSimples(dataStr) {
            if (!dataStr) return '';
            const partes = dataStr.split('-');
            if (partes.length === 3) return `${partes[2]}/${partes[1]}/${partes[0]}`;
            return dataStr;
        }

        async function identificarPousada() {
            const labelPousada = document.getElementById('nomePousadaLogada');

            const { data: { user } } = await supabaseClient.auth.getUser();
            
            if (!user) {
                labelPousada.textContent = 'Atenção: Usuário não autenticado.';
                labelPousada.className = 'text-sm font-semibold text-red-600 mt-0.5';
                setTimeout(() => { window.location.href = 'index.html'; }, 2000);
                return;
            }

            usuarioIdAtual = user.id;

            const { data: pousada } = await supabaseClient.from('pousadas').select('nome').eq('id', user.id).single();
            
            if (pousada && pousada.nome) {
                labelPousada.textContent = `Pousada: ${pousada.nome}`;
            } else {
                labelPousada.textContent = `Pousada ID: ${user.id}`;
            }

            await carregarMapaSuites();
            carregarDadosFinanceiros();
        }

        async function carregarMapaSuites() {
            const { data: suites } = await supabaseClient.from('suites').select('id, nome').eq('pousada_id', usuarioIdAtual);
            mapaSuitesCache = {};
            if (suites) {
                suites.forEach(s => {
                    mapaSuitesCache[s.id] = s.nome;
                });
            }
        }

        async function carregarDadosFinanceiros() {
            if (!usuarioIdAtual) return;

            const dataInicio = document.getElementById('filtroInicio').value || '2026-08-01';
            const dataFim = document.getElementById('filtroFim').value || '2026-08-31';
            const statusSelecionado = document.getElementById('filtroStatus').value;

            // 1. Busca as reservas do período
            let query = supabaseClient
                .from('reservas')
                .select('*')
                .eq('pousada_id', usuarioIdAtual)
                .gte('checkin', dataInicio)
                .lte('checkin', dataFim);

            if (statusSelecionado !== 'TODAS') {
                query = query.eq('status', statusSelecionado);
            } else {
                query = query.in('status', ['Aprovada', 'Finalizada']);
            }

            const { data: reservas, error } = await query;

            if (error) {
                console.error('Erro ao buscar reservas:', error);
                alert('Erro ao carregar dados financeiros.');
                return;
            }

            // 2. Busca os pagamentos vinculados para cruzar com a inteligência de sinais/saldos (igual ao dashboard)
            const { data: pagamentos } = await supabaseClient
                .from('hospede_pagamentos')
                .select('*')
                .eq('pousada_id', usuarioIdAtual);

            let faturamentoTotal = 0;
            let totalRecebidoGeral = 0;
            let totalSaldoGeral = 0;
            let corpoTabela = '';

            if (!reservas || reservas.length === 0) {
                corpoTabela = `<tr><td colspan="7" class="py-4 px-6 text-center text-gray-500">Nenhuma reserva encontrada para este período e status.</td></tr>`;
            } else {
                reservas.forEach(reserva => {
                    const valorTotal = Number(reserva.valor_total) || 0;
                    
                    // Calcula o total pago cruzando com a tabela hospede_pagamentos
                    const pagamentosDestaReserva = (pagamentos || []).filter(p => p.reserva_id === reserva.id);
                    const totalPago = pagamentosDestaReserva.reduce((acc, curr) => acc + Number(curr.valor_pago || 0), 0);
                    const saldoRestante = valorTotal - totalPago;

                    faturamentoTotal += valorTotal;
                    totalRecebidoGeral += totalPago;
                    totalSaldoGeral += saldoRestante > 0 ? saldoRestante : 0;

                    const nomeSuiteAmigavel = mapaSuitesCache[reserva.suite_id] || 'Suíte Padrão';

                    let badgeCor = 'bg-green-100 text-green-800';
                    if (reserva.status === 'Finalizada') badgeCor = 'bg-gray-200 text-gray-700';
                    else if (reserva.status === 'Cancelada' || reserva.status === 'Recusada') badgeCor = 'bg-red-100 text-red-700';

                    corpoTabela += `
                        <tr class="hover:bg-gray-50">
                            <td class="py-4 px-6 text-xs">
                                <span class="font-semibold text-gray-900">${formatarDataSimples(reserva.checkin)}</span><br>
                                <span class="text-gray-500">até ${formatarDataSimples(reserva.checkout)}</span>
                            </td>
                            <td class="py-4 px-6 font-medium text-gray-900">${reserva.hospede_nome || 'Hóspede'}</td>
                            <td class="py-4 px-6 text-xs font-semibold text-gray-700">${nomeSuiteAmigavel}</td>
                            <td class="py-4 px-6 font-semibold text-gray-800">${formatarMoeda(valorTotal)}</td>
                            <td class="py-4 px-6 font-semibold text-emerald-700">${formatarMoeda(totalPago)}</td>
                            <td class="py-4 px-6 font-semibold ${saldoRestante > 0 ? 'text-amber-600' : 'text-emerald-600'}">${formatarMoeda(saldoRestante)}</td>
                            <td class="py-4 px-6">
                                <span class="px-2.5 py-1 text-xs rounded-full ${badgeCor}">
                                    ${reserva.status}
                                </span>
                            </td>
                        </tr>
                    `;
                });
            }

            document.getElementById('tabelaFinanceira').innerHTML = corpoTabela;

            // Atualiza os KPIs com os valores reais calculados
            document.getElementById('kpiFaturamento').innerText = formatarMoeda(faturamentoTotal);
            document.getElementById('kpiRecebido').innerText = formatarMoeda(totalRecebidoGeral);
            document.getElementById('kpiSaldo').innerText = formatarMoeda(totalSaldoGeral);
        }

        window.onload = () => {
            document.getElementById('filtroInicio').value = '2026-08-01';
            document.getElementById('filtroFim').value = '2026-08-31';
            identificarPousada();
        };
    </script>
</body>
</html>
