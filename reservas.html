<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel de Controle - Gestão de Reservas</title>
    <!-- Importação do Tailwind CSS para estilização limpa e moderna -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Importação do cliente Supabase para comunicação com o banco de dados -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">

    <div class="flex h-screen">
        <!-- Menu Lateral -->
        <aside class="w-64 bg-gray-800 text-white flex flex-col">
            <div class="p-5 text-2xl font-bold tracking-wider border-b border-gray-700">
                Painel 360
            </div>
            <nav class="flex-1 p-4 space-y-2">
                <a href="#" class="block py-2.5 px-4 rounded bg-gray-700 text-white font-semibold">Reservas</a>
                <a href="#" class="block py-2.5 px-4 rounded hover:bg-gray-700 text-gray-300">Suítes</a>
                <a href="#" class="block py-2.5 px-4 rounded hover:bg-gray-700 text-gray-300">Hóspedes</a>
            </nav>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="flex-1 flex flex-col overflow-y-auto">
            <header class="bg-white shadow px-6 py-4 flex justify-between items-center">
                <h1 class="text-xl font-bold text-gray-800">Gerenciamento de Solicitações de Reserva</h1>
                <span id="user-status" class="text-sm text-green-600 font-medium">Sistema Online</span>
            </header>

            <div class="p-6">
                <!-- Seção de Reservas Pendentes -->
                <div class="bg-white rounded-lg shadow overflow-hidden">
                    <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
                        <h2 class="text-lg font-semibold text-gray-700">Solicitações Pendentes</h2>
                        <button onclick="carregarReservas()" class="text-sm bg-blue-500 hover:bg-blue-600 text-white px-3 py-1.5 rounded transition">Atualizar Lista</button>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-50 text-gray-600 uppercase text-xs tracking-wider">
                                    <th class="py-3 px-6">Hóspede</th>
                                    <th class="py-3 px-6">Contato / CPF</th>
                                    <th class="py-3 px-6">Período</th>
                                    <th class="py-3 px-6">Status</th>
                                    <th class="py-3 px-6 text-center">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="tabela-reservas" class="divide-y divide-gray-200 text-sm text-gray-700">
                                <!-- Os dados serão injetados dinamicamente via JavaScript -->
                                <tr>
                                    <td colspan="5" class="py-4 text-center text-gray-500">Carregando solicitações...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Script de Integração e Lógica -->
    <script>
        // Configuração inicial das credenciais do Supabase (substitua pelas chaves do seu ambiente de produção)
        const SUPABASE_URL = 'SUA_SUPABASE_URL_AQUI';
        const SUPABASE_ANON_KEY = 'SUA_SUPABASE_ANON_KEY_AQUI';
        
        // Inicialização correta do cliente Supabase
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        /**
         * Função responsável por buscar as reservas pendentes no banco de dados 
         * e renderizá-las na tabela HTML de forma dinâmica.
         */
        async function carregarReservas() {
            const tbody = document.getElementById('tabela-reservas');
            tbody.innerHTML = `<tr><td colspan="5" class="py-4 text-center text-gray-500">Buscando dados...</td></tr>`;

            // Consulta à tabela 'reservas' filtrando por status pendente ou ordenando por data
            const { data, error } = await supabaseClient
                .from('reservas')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                console.error('Erro ao carregar reservas:', error.message);
                tbody.innerHTML = `<tr><td colspan="5" class="py-4 text-center text-red-500">Erro ao carregar dados do servidor.</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-4 text-center text-gray-500">Nenhuma reserva encontrada.</td></tr>`;
                return;
            }

            // Limpa e reconstrói as linhas da tabela com os dados reais
            tbody.innerHTML = '';
            data.forEach(reserva => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="py-4 px-6 font-medium">${reserva.nome_hospede || 'Não informado'}</td>
                    <td class="py-4 px-6">${reserva.contato || '-'}<br><span class="text-xs text-gray-400">${reserva.cpf_rg || ''}</span></td>
                    <td class="py-4 px-6">${reserva.checkin || ''} até ${reserva.checkout || ''}</td>
                    <td class="py-4 px-6">
                        <span class="px-2.5 py-1 rounded-full text-xs font-semibold ${
                            reserva.status === 'Aprovado' ? 'bg-green-100 text-green-800' :
                            reserva.status === 'Recusado' ? 'bg-red-100 text-red-800' : 'bg-yellow-100 text-yellow-800'
                        }">
                            ${reserva.status || 'Pendente'}
                        </span>
                    </td>
                    <td class="py-4 px-6 text-center space-x-2">
                        <button onclick="atualizarStatus(${reserva.id}, 'Aprovado')" class="bg-green-500 hover:bg-green-600 text-white px-3 py-1 rounded text-xs transition">Aprovar</button>
                        <button onclick="atualizarStatus(${reserva.id}, 'Recusado')" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-xs transition">Recusar</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        /**
         * Função responsável por atualizar o status de uma reserva específica no Supabase
         * @param {number} id - Identificador único da reserva
         * @param {string} novoStatus - O novo status a ser aplicado ('Aprovado' ou 'Recusado')
         */
        async function atualizarStatus(id, novoStatus) {
            const confirmacao = confirm(`Deseja realmente alterar o status desta reserva para "${novoStatus}"?`);
            if (!confirmacao) return;

            // Executa o comando de atualização diretamente na tabela 'reservas' do Supabase
            const { error } = await supabaseClient
                .from('reservas')
                .update({ status: novoStatus })
                .eq('id', id);

            if (error) {
                alert('Erro ao atualizar o status: ' + error.message);
            } else {
                // Recarrega a listagem para refletir a mudança instantaneamente na tela
                carregarReservas();
            }
        }

        // Executa a carga inicial assim que a página é totalmente carregada no navegador
        window.onload = () => {
            carregarReservas();
        };
    </script>
</body>
</html>
