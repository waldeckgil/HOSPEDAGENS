<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Reservas</title>
    <!-- Importação das bibliotecas do Supabase e Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">

    <!-- Navegação Ajustada com o nome da pousada exibido dinamicamente ao lado -->
    <nav class="bg-white shadow-md p-6 mb-8 rounded-2xl flex justify-between items-center">
        <div class="flex items-center gap-8 font-bold text-gray-700">
            <div class="flex items-center space-x-3">
                <a href="dashboard.html" class="hover:text-blue-600 transition">Minhas Suítes</a>
                <a href="reservas.html" class="text-blue-600 border-b-2 border-blue-600 pb-1">Ver Reservas</a>
                <a href="configurar-pousada.html" class="hover:text-blue-600 transition">Minha Pousada</a>
            </div>
            <!-- Elemento multitenant para exibir o nome da pousada logada -->
            <span id="nome-pousada-header" class="text-xs bg-indigo-100 text-indigo-800 font-semibold px-3 py-1 rounded-full">Carregando pousada...</span>
        </div>
        <button onclick="fazerLogout()" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-xl transition">Sair</button>
    </nav>

    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Solicitações de Reserva</h1>
        <div id="reservas-container" class="space-y-4"></div>
    </div>

    <script>
        // Configuração com as chaves inseridas diretamente conforme solicitado
        const SUPABASE_URL = 'https://evrkniykafvydnhxycit.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_TCHdTjTVsu652onrjqjptw_RUCJaqTs';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        /**
         * Busca o nome da pousada com base no ID do usuário logado (multitenant)
         * e atualiza o elemento visual no cabeçalho.
         */
        async function carregarNomePousada(userId) {
            const badgePousada = document.getElementById('nome-pousada-header');
            try {
                // Consulta à tabela de pousadas utilizando o ID do usuário autenticado
                const { data, error } = await supabaseClient
                    .from('pousadas')
                    .select('nome')
                    .eq('id', userId)
                    .single();

                if (error || !data) {
                    badgePousada.textContent = 'Minha Pousada';
                } else {
                    badgePousada.textContent = data.nome;
                }
            } catch (err) {
                badgePousada.textContent = 'Painel Pousada';
            }
        }

        /**
         * Função principal que valida a sessão, busca o nome da pousada 
         * e lista todas as solicitações correspondentes.
         */
        async function carregarReservas() {
            // Verifica se há um usuário autenticado no sistema
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) { 
                window.location.href = 'index.html'; 
                return; 
            }

            // Dispara a busca do nome da pousada para exibir no menu superior
            carregarNomePousada(user.id);

            // Buscando as reservas filtradas estritamente para o dono da pousada logado
            const { data: reservas, error } = await supabaseClient
                .from('reservas')
                .select('*')
                .eq('pousada_id', user.id)
                .order('criado_em', { ascending: false });

            const container = document.getElementById('reservas-container');
            container.innerHTML = '';

            if (error) { 
                container.innerHTML = '<p class="text-red-500">Erro ao carregar: ' + error.message + '</p>'; 
                return; 
            }
            if (!reservas || reservas.length === 0) { 
                container.innerHTML = '<p class="text-gray-600">Nenhuma reserva encontrada.</p>'; 
                return; 
            }

            // Montagem dinâmica dos cards de reservas na tela
            reservas.forEach(res => {
                let dataHoraCriacao = '';
                if (res.criado_em) {
                    const dataObj = new Date(res.criado_em);
                    dataHoraCriacao = `🕒 Solicitado em: ${dataObj.toLocaleDateString('pt-BR')} às ${dataObj.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}`;
                }

                container.innerHTML += `
                    <div class="bg-white p-6 rounded-xl shadow border-l-8 ${res.status === 'Pendente' ? 'border-yellow-500' : 'border-green-500'}">
                        <div class="flex justify-between items-start">
                            <h2 class="text-xl font-bold text-gray-800">${res.hospede_nome}</h2>
                            <span class="text-xs text-gray-500 font-semibold">${dataHoraCriacao}</span>
                        </div>
                        
                        <!-- Detalhes de Contato e Documentação -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-2 mt-3 text-sm text-gray-600 bg-gray-50 p-3 rounded-lg">
                            <p><strong>E-mail:</strong> ${res.email || 'Não informado'}</p>
                            <p><strong>WhatsApp:</strong> ${res.whatsapp_hospede || 'Não informado'}</p>
                            <p><strong>CPF:</strong> ${res.cpf || 'Não informado'} | <strong>RG:</strong> ${res.rg || 'Não informado'}</p>
                            <p class="md:col-span-2"><strong>Endereço:</strong> ${res.endereco || 'Não informado'}</p>
                        </div>

                        <p class="text-sm text-gray-700 mt-3"><strong>Check-in:</strong> ${res.checkin} | <strong>Check-out:</strong> ${res.checkout}</p>
                        <p class="font-semibold mt-1">Status: <span class="${res.status === 'Pendente' ? 'text-yellow-600' : 'text-green-600'}">${res.status}</span></p>
                        
                        <!-- Botões de Ação para Aprovar ou Recusar -->
                        <div class="mt-4 flex gap-2">
                            ${res.status === 'Pendente' ? `
                                <button onclick="atualizarStatus('${res.id}', 'Aprovada')" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg transition font-bold">Aprovar</button>
                                <button onclick="atualizarStatus('${res.id}', 'Recusada')" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg transition font-bold">Recusar</button>
                            ` : ''}
                        </div>
                    </div>
                `;
            });
        }

        /**
         * Atualiza o status da reserva no banco de dados e recarrega a listagem
         */
        async function atualizarStatus(id, novoStatus) {
            const { error } = await supabaseClient.from('reservas').update({ status: novoStatus }).eq('id', id);
            if (error) alert('Erro ao atualizar: ' + error.message);
            else carregarReservas();
        }

        /**
         * Encerra a sessão atual do usuário e redireciona para a tela de login
         */
        function fazerLogout() {
            supabaseClient.auth.signOut();
            window.location.href = 'index.html';
        }

        // Inicializa a carga dos dados assim que a página é aberta
        carregarReservas();
    </script>
</body>
</html>
