<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel de Controle - Gestão de Reservas</title>
    <!-- Importação do Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Importação do cliente Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">

    <div class="flex h-screen">
        <!-- Menu Lateral -->
        <aside class="w-64 bg-gray-800 text-white flex flex-col">
            <div class="p-5 text-2xl font-bold tracking-wider border-b border-gray-700">
                Painel 360
            </div>
            <nav class="flex-1 p-4 space-y-2">
                <a href="reservas.html" class="block py-2.5 px-4 rounded bg-gray-700 text-white font-semibold">Reservas</a>
                <a href="dashboard.html" class="block py-2.5 px-4 rounded hover:bg-gray-700 text-gray-300">Suítes</a>
                <a href="configurar-pousada.html" class="block py-2.5 px-4 rounded hover:bg-gray-700 text-gray-300">Minha Pousada</a>
            </nav>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="flex-1 flex flex-col overflow-y-auto">
            <header class="bg-white shadow px-6 py-4 flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <h1 class="text-xl font-bold text-gray-800">Gerenciamento de Solicitações de Reserva</h1>
                    <!-- Elemento dinâmico que exibe o nome da pousada identificada pelo UUID logado -->
                    <span id="nome-pousada-header" class="text-xs bg-indigo-100 text-indigo-800 font-semibold px-2.5 py-1 rounded-full">Carregando pousada...</span>
                </div>
                <span id="user-status" class="text-sm text-green-600 font-medium">Sistema Online</span>
            </header>

            <div class="p-6">
                <!-- Seção de Reservas -->
                <div class="bg-white rounded-lg shadow overflow-hidden">
                    <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
                        <h2 class="text-lg font-semibold text-gray-700">Solicitações e Reservas</h2>
                        <button onclick="carregarDadosPousadaEReservas()" class="text-sm bg-blue-500 hover:bg-blue-600 text-white px-3 py-1.5 rounded transition">Atualizar Lista</button>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-50 text-gray-600 uppercase text-xs tracking-wider">
                                    <th class="py-3 px-6">Hóspede</th>
                                    <th class="py-3 px-6">Contato / CPF</th>
                                    <th class="py-3 px-6">Período</th>
                                    <th class="py-3 px-6">Status</th>
                                    <th class="py-3 px-6 text-center">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="tabela-reservas" class="divide-y divide-gray-200 text-sm text-gray-700">
                                <tr>
                                    <td colspan="5" class="py-4 text-center text-gray-500">Carregando solicitações...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Script de Integração e Lógica Completa -->
    <script>
        // Credenciais do Supabase
        const SUPABASE_URL = 'https://evrkniykafvydnhxycit.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_TCHdTjTVsu652onrjqjptw_RUCJaqTs';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function carregarNomePousada(userId) {
            const badgePousada = document.getElementById('nome-pousada-header');
            try {
                const { data, error } = await supabaseClient
                    .from('pousadas')
                    .select('nome')
                    .eq('id', userId)
                    .single();

                if (error || !data) {
                    badgePousada.textContent = 'Minha Pousada';
                } else {
                    badgePousada.textContent = data.nome;
                }
            } catch (err) {
                badgePousada.textContent = 'Painel Pousada';
            }
        }

        async function carregarDadosPousadaEReservas() {
            const { data: { user }, error: authError } = await supabaseClient.auth.getUser();
            
            if (authError || !user) {
                window.location.href = 'index.html';
                return;
            }

            const pousadaId = user.id; 
            await carregarNomePousada(pousadaId);

            const tbody = document.getElementById('tabela-reservas');
            tbody.innerHTML = `<tr><td colspan="5" class="py-4 text-center text-gray-500">Buscando dados...</td></tr>`;

            const { data, error } = await supabaseClient
                .from('reservas')
                .select('*')
                .eq('pousada_id', pousadaId)
                .order('criado_em', { ascending: false });

            if (error) {
                console.error('Erro ao carregar reservas:', error.message);
                tbody.innerHTML = `<tr><td colspan="5" class="py-4 text-center text-red-500">Erro ao carregar dados do servidor.</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-4 text-center text-gray-500">Nenhuma solicitação encontrada para esta pousada.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            data.forEach(reserva => {
                const tr = document.createElement('tr');
                const statusAtual = reserva.status || 'Pendente';
                
                // Formatação das cores do status
                let classeStatus = 'bg-yellow-100 text-yellow-800';
                if (statusAtual === 'Aprovada' || statusAtual === 'Aprovado') classeStatus = 'bg-green-100 text-green-800';
                if (statusAtual === 'Recusada' || statusAtual === 'Recusado' || statusAtual === 'Cancelada') classeStatus = 'bg-red-100 text-red-800';

                tr.innerHTML = `
                    <td class="py-4 px-6 font-medium">${reserva.hospede_nome || reserva.nome_hospede || 'Não informado'}</td>
                    <td class="py-4 px-6">${reserva.whatsapp_hospede || reserva.contato || '-'}<br><span class="text-xs text-gray-400">CPF: ${reserva.cpf || reserva.cpf_rg || 'Não informado'}</span></td>
                    <td class="py-4 px-6">${reserva.checkin || ''} até ${reserva.checkout || ''}</td>
                    <td class="py-4 px-6">
                        <span class="px-2.5 py-1 rounded-full text-xs font-semibold ${classeStatus}">
                            ${statusAtual}
                        </span>
                    </td>
                    <td class="py-4 px-6 text-center space-x-2">
                        ${statusAtual === 'Pendente' ? `
                            <button onclick="atualizarStatus('${reserva.id}', 'Aprovada', '${reserva.suite_id || ''}', '${reserva.checkin}', '${reserva.checkout}')" class="bg-green-500 hover:bg-green-600 text-white px-3 py-1 rounded text-xs transition">Aprovar</button>
                            <button onclick="atualizarStatus('${reserva.id}', 'Recusada', '${reserva.suite_id || ''}', '${reserva.checkin}', '${reserva.checkout}')" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-xs transition">Recusar</button>
                        ` : statusAtual === 'Aprovada' ? `
                            <button onclick="atualizarStatus('${reserva.id}', 'Cancelada', '${reserva.suite_id || ''}', '${reserva.checkin}', '${reserva.checkout}')" class="bg-orange-500 hover:bg-orange-600 text-white px-3 py-1 rounded text-xs transition">Cancelar</button>
                        ` : '<span class="text-xs text-gray-400">Encerrado</span>'}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        /**
         * Valida conflito de datas antes de aprovar
         */
        async function verificarConflitoDeDatas(suiteId, checkin, checkout, reservaIdAtual) {
            if (!suiteId) return false; // Se não houver suíte vinculada, não há como cruzar conflito físico

            const { data: reservasExistentes, error } = await supabaseClient
                .from('reservas')
                .select('*')
                .eq('suite_id', suiteId)
                .eq('status', 'Aprovada')
                .neq('id', reservaIdAtual);

            if (error || !reservasExistentes) return false;

            const novoInicio = new Date(checkin);
            const novoFim = new Date(checkout);

            for (let res of reservasExistentes) {
                const inicioExistente = new Date(res.checkin);
                const fimExistente = new Date(res.checkout);

                // Regra de interseção de datas: (StartA < EndB) e (EndA > StartB)
                if (novoInicio < fimExistente && novoFim > inicioExistente) {
                    return true; // Conflito detectado!
                }
            }

            return false;
        }

        /**
         * Atualiza o status da reserva e gerencia o controle de conflitos
         */
        async function atualizarStatus(id, novoStatus, suiteId, checkin, checkout) {
            if (novoStatus === 'Aprovada') {
                const temConflito = await verificarConflitoDeDatas(suiteId, checkin, checkout, id);
                if (temConflito) {
                    alert('⚠️ Conflito de Datas: Já existe outra reserva APROVADA para esta mesma suíte neste período!');
                    return; 
                }
            }

            const acaoTexto = novoStatus === 'Aprovada' ? 'aprovar' : novoStatus === 'Recusada' ? 'recusar' : 'cancelar';
            const confirmacao = confirm(`Deseja realmente ${acaoTexto} esta reserva?`);
            if (!confirmacao) return;

            const { error: erroReserva } = await supabaseClient
                .from('reservas')
                .update({ status: novoStatus })
                .eq('id', id);

            if (erroReserva) {
                alert('Erro ao atualizar a reserva: ' + erroReserva.message);
                return;
            }

            carregarDadosPousadaEReservas();
        }

        window.onload = () => {
            carregarDadosPousadaEReservas();
        };
    </script>
</body>
</html>
